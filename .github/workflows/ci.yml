name: VAC Web CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Synthetic security regression tests
        run: npm run security:test

      - name: Check tracked files for public repository safety
        run: npm run security:public

      - name: Audit runtime dependencies for high severity advisories
        run: npm run security:audit

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
