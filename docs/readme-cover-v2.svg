<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="452" viewBox="0 0 1200 452" role="img" aria-labelledby="title description">
<title id="title">Visual Archive Club — Eastern University</title>
<desc id="description">Cinematic midnight-blue banner featuring expressive ivory and ember-orange typography alongside a large photographic-style sunset film frame, with an animated recording light and gentle cinematic motion.</desc>
<defs>
  <linearGradient id="back" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#101923"/><stop offset=".52" stop-color="#0A1119"/><stop offset="1" stop-color="#17141A"/>
  </linearGradient>
  <radialGradient id="halo"><stop stop-color="#FF984D" stop-opacity=".25"/><stop offset="1" stop-color="#FF984D" stop-opacity="0"/></radialGradient>
  <linearGradient id="titleOrange" x1="0" y1="0" x2="1" y2=".5">
    <stop stop-color="#FFBD84"/><stop offset=".48" stop-color="#FF964C"/><stop offset="1" stop-color="#E66E32"/>
  </linearGradient>
  <linearGradient id="sky" x1="0" y1="0" x2=".75" y2="1">
    <stop stop-color="#29354B"/><stop offset=".35" stop-color="#66505B"/>
    <stop offset=".72" stop-color="#B76C56"/><stop offset="1" stop-color="#E9A16A"/>
  </linearGradient>
  <radialGradient id="sun"><stop stop-color="#FFE1AA" stop-opacity=".95"/><stop offset=".33" stop-color="#FFC08B" stop-opacity=".5"/><stop offset="1" stop-color="#FFC08B" stop-opacity="0"/></radialGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#EBD9CC" stop-opacity=".20"/><stop offset=".45" stop-color="#FFFFFF" stop-opacity=".02"/><stop offset="1" stop-color="#08121D" stop-opacity=".32"/>
  </linearGradient>
  <pattern id="lines" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M56 0H0V56" stroke="#F5EEE4" stroke-opacity=".035" fill="none"/></pattern>
  <pattern id="grain" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="2" cy="6" r=".65" fill="#FFF" opacity=".09"/><circle cx="7" cy="1" r=".55" fill="#FFE0BB" opacity=".11"/></pattern>
  <clipPath id="screen"><rect x="730" y="82" width="387" height="284" rx="13"/></clipPath>
  <filter id="soft"><feGaussianBlur stdDeviation="27"/></filter>
</defs>
<style>
  .slowfloat{animation:slowfloat 8s ease-in-out infinite;transform-origin:925px 229px}
  .record{animation:record 2.4s steps(1,end) infinite}
  .lightline{animation:lightline 7s ease-in-out infinite}
  @keyframes slowfloat {0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  @keyframes record {0%,55%{opacity:1}56%,100%{opacity:.3}}
  @keyframes lightline {0%,100%{opacity:.35}50%{opacity:1}}
  @media(prefers-reduced-motion:reduce){.slowfloat,.record,.lightline{animation:none!important}}
</style>
<rect width="1200" height="452" rx="24" fill="url(#back)"/>
<rect width="1200" height="452" rx="24" fill="url(#lines)"/>
<ellipse cx="913" cy="235" rx="300" ry="275" fill="url(#halo)"/>
<rect x="1.5" y="1.5" width="1197" height="449" rx="22.5" fill="none" stroke="#EEC7A5" stroke-opacity=".24" stroke-width="1.5"/>
<rect x="57" y="42" width="60" height="3" rx="1.5" fill="#FF9953"/>
<rect x="128" y="42" width="21" height="3" rx="1.5" fill="#FF9953" opacity=".3"/>
<circle cx="158" cy="43.5" r="3.3" fill="#FFA35F"/>
<text x="60" y="78" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="700" letter-spacing="3.2" fill="#E7CAB2">EASTERN UNIVERSITY  /  EST. 2010</text>
<text x="55" y="176" font-family="Georgia,'Times New Roman',serif" font-size="99" font-weight="700" letter-spacing="-4.3" fill="#F9F5EF">VISUAL</text>
<text x="54" y="278" font-family="Georgia,'Times New Roman',serif" font-size="103" font-style="italic" font-weight="700" letter-spacing="-6" fill="url(#titleOrange)">Archive</text>
<text x="58" y="371" font-family="Georgia,'Times New Roman',serif" font-size="99" font-weight="700" letter-spacing="-4.3" fill="#F9F5EF">CLUB.</text>
<path d="M61 391H102" stroke="#FFA45F" stroke-width="2.5" stroke-linecap="round"/>
<text x="116" y="396" font-family="Arial,Helvetica,sans-serif" font-size="16" letter-spacing=".5" fill="#CBD0D4">Where every frame becomes history.</text>
<text x="60" y="429" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="3" fill="#A78B79">CREATE  /  CAPTURE  /  REMEMBER</text>
