<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
<title id="title">Visual Archive Club, Eastern University</title>
<desc id="desc">A cinematic midnight-blue cover with editorial lettering, warm amber accents, and an abstract film-frame collage. Where every frame becomes history.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101923"/><stop offset=".62" stop-color="#090f17"/><stop offset="1" stop-color="#15151a"/></linearGradient>
  <radialGradient id="warm"><stop stop-color="#F78538" stop-opacity=".27"/><stop offset="1" stop-color="#F78538" stop-opacity="0"/></radialGradient>
  <linearGradient id="orange" x1="0" y1="0" x2="1" y2=".3"><stop stop-color="#FFBA79"/><stop offset=".55" stop-color="#FF8C35"/><stop offset="1" stop-color="#D96B26"/></linearGradient>
  <linearGradient id="scene" x1=".2" y1="0" x2=".7" y2="1"><stop stop-color="#1F2D40"/><stop offset=".5" stop-color="#3B4250"/><stop offset=".75" stop-color="#B86945"/><stop offset="1" stop-color="#1E232D"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF" stop-opacity=".13"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".01"/></linearGradient>
  <pattern id="grid" width="69" height="69" patternUnits="userSpaceOnUse"><path d="M69 0H0V69" fill="none" stroke="#FFFFFF" stroke-opacity=".045" stroke-width="1"/></pattern>
  <filter id="blur"><feGaussianBlur stdDeviation="34"/></filter>
  <clipPath id="frame"><rect x="803" y="95" width="282" height="288" rx="15"/></clipPath>
</defs>
<rect width="1200" height="470" rx="24" fill="url(#bg)"/>
<rect width="1200" height="470" rx="24" fill="url(#grid)"/>
<ellipse cx="910" cy="188" rx="320" ry="310" fill="url(#warm)" filter="url(#blur)"/>
<rect x="1" y="1" width="1198" height="468" rx="23" fill="none" stroke="#F5D9BE" stroke-opacity=".17"/>
<path d="M55 34H146" stroke="#FF9A4F" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="158" cy="34" r="3.5" fill="#FFA762"><animate attributeName="opacity" values=".4;1;.4" dur="4s" repeatCount="indefinite"/></circle>
<text x="57" y="82" fill="#D4C6B6" font-family="Arial,Helvetica,sans-serif" font-size="14" letter-spacing="4" font-weight="700">EASTERN UNIVERSITY  /  EST. 2010</text>
<text x="51" y="191" fill="#F8F5F0" font-family="Georgia,'Times New Roman',serif" font-size="108" font-weight="700" letter-spacing="-5">VISUAL</text>
<text x="51" y="293" fill="url(#orange)" font-family="Georgia,'Times New Roman',serif" font-size="106" font-style="italic" font-weight="700" letter-spacing="-7">Archive</text>
<text x="55" y="382" fill="#F8F5F0" font-family="Georgia,'Times New Roman',serif" font-size="100" font-weight="700" letter-spacing="-5">CLUB.</text>
<text x="59" y="427" fill="#BFC6CE" font-family="Arial,Helvetica,sans-serif" font-size="17" letter-spacing=".25">Where every frame becomes history.</text>
<g opacity=".9">
  <rect x="791" y="82" width="306" height="315" rx="24" fill="#10151D" stroke="#FFE0BB" stroke-opacity=".21" transform="rotate(-3 944 239)"/>
  <rect x="803" y="95" width="282" height="288" rx="15" fill="url(#scene)"/>
  <g clip-path="url(#frame)">
    <rect x="803" y="95" width="282" height="288" fill="url(#scene)"/>
    <circle cx="1007" cy="183" r="62" fill="#FBB47A" fill-opacity=".47" filter="url(#blur)"/>
    <path d="M803 304L857 264L922 290L994 241L1085 277V383H803Z" fill="#15212D" opacity=".9"/>
    <path d="M803 346L867 318L931 339L999 304L1085 326V383H803Z" fill="#0B151F" opacity=".93"/>
    <path d="M1036 261l15 -38 14 38 8 122h-45z" fill="#08121C" opacity=".95"/>
    <rect x="803" y="95" width="282" height="288" fill="url(#glass)"/>
    <path d="M827 116h26M827 116v26M1059 116h-26M1059 116v26M827 363h26M827 363v-26M1059 363h-26M1059 363v-26" stroke="#EFD7C5" stroke-opacity=".63" stroke-width="2" fill="none"/>
  </g>
  <rect x="803" y="95" width="282" height="288" rx="15" stroke="#F2B77F" stroke-opacity=".35" fill="none"/>
  <rect x="753" y="322" width="196" height="91" rx="13" fill="#151F2A" stroke="#D4DCE5" stroke-opacity=".25" transform="rotate(5 851 367)"/>
  <path d="M767 351L935 365M768 370L930 384" stroke="#FFA66D" stroke-opacity=".45" stroke-width="2"/>
  <text x="774" y="349" fill="#EEC8A8" font-family="Arial,Helvetica,sans-serif" font-size="9" letter-spacing="2" transform="rotate(5 851 367)">VAC  /  FRAME 001</text>
  <text x="774" y="398" fill="#F8F5EF" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="13" letter-spacing="1" transform="rotate(5 851 367)">CREATE  ·  CAPTURE  ·  REMEMBER</text>
  <rect x="1050" y="50" width="76" height="34" rx="17" fill="#21252D" stroke="#F3A15C" stroke-opacity=".7"/>
  <circle cx="1071" cy="67" r="4" fill="#FF9850"><animate attributeName="opacity" values="1;.35;1" dur="3.5s" repeatCount="indefinite"/></circle>
  <text x="1083" y="71" fill="#F5D1B2" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700">REC</text>
</g>
<path d="M1132 121v220" stroke="#FCAD70" stroke-opacity=".28" stroke-width="1.2" stroke-dasharray="4 9"/>
<path d="M1132 121v64" stroke="#FCAD70" stroke-opacity=".85" stroke-width="1.2" stroke-dasharray="4 9"><animateTransform attributeName="transform" type="translate" values="0 0;0 135;0 0" dur="10s" repeatCount="indefinite"/></path>
</svg>