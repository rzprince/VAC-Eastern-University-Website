<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="272" viewBox="0 0 1200 272" role="img" aria-labelledby="title desc">
<title id="title">Proprietary source. All rights reserved.</title>
<desc id="desc">A cinematic midnight and ember orange access warning for the copyrighted VAC website. The subtle glow and scanning line animate where supported.</desc>
<defs>
 <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#121A23"/><stop offset=".58" stop-color="#080D14"/><stop offset="1" stop-color="#1C1616"/></linearGradient>
 <linearGradient id="ember" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#E77834"/><stop offset=".46" stop-color="#FFC18A"/><stop offset="1" stop-color="#FF8241"/></linearGradient>
 <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#FFB277" stop-opacity="0"/><stop offset=".5" stop-color="#FFB277" stop-opacity=".18"/><stop offset="1" stop-color="#FFB277" stop-opacity="0"/></linearGradient>
 <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M60 0H0V60" fill="none" stroke="#FAE6D3" stroke-opacity=".035" stroke-width="1"/></pattern>
 <filter id="glow"><feGaussianBlur stdDeviation="19"/></filter>
 <clipPath id="clip"><rect width="1200" height="272" rx="22"/></clipPath>
</defs>
<style>
 .signal{animation:signal 3.4s ease-in-out infinite}
 .scan{animation:scan 7.5s linear infinite}
 .lock{animation:lockglow 5.5s ease-in-out infinite}
 .stripe{animation:stripe 11s linear infinite}
 @keyframes signal{0%,100%{opacity:.4}50%{opacity:1}}
 @keyframes scan{0%{transform:translateX(-400px)}100%{transform:translateX(1600px)}}
 @keyframes lockglow{0%,100%{opacity:.45}50%{opacity:.95}}
 @keyframes stripe{to{stroke-dashoffset:-60}}
 @media (prefers-reduced-motion:reduce){.signal,.scan,.lock,.stripe{animation:none!important}}
</style>
<g clip-path="url(#clip)">
<rect width="1200" height="272" rx="22" fill="url(#background)"/>
<rect width="1200" height="272" fill="url(#grid)"/>
<ellipse class="lock" cx="975" cy="142" rx="170" ry="115" fill="#D96326" opacity=".14" filter="url(#glow)"/>
<path class="stripe" d="M-20 248H1220" stroke="url(#ember)" stroke-width="2" stroke-dasharray="24 36" opacity=".65"/>
<path class="scan" d="M-120 -40h150L100 320H-50Z" fill="url(#sheen)"/>
<rect x="1" y="1" width="1198" height="270" rx="21" fill="none" stroke="#E5B28D" stroke-opacity=".27"/>
<rect x="0" y="0" width="8" height="272" fill="url(#ember)"/>
<rect x="40" y="35" width="144" height="29" rx="14.5" fill="#2B211D" stroke="#FFB77C" stroke-opacity=".38"/>
<circle class="signal" cx="56" cy="49" r="4.5" fill="#FF9D60"/>
<text x="72" y="53" fill="#FFCC9A" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="1.8">LEGAL NOTICE</text>
<text x="44" y="117" fill="#FCF7F0" font-family="Georgia,'Times New Roman',serif" font-size="55" font-weight="700" letter-spacing="-1.1">A work of original identity.</text>
<text x="45" y="167" fill="url(#ember)" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="47" font-weight="700" letter-spacing="-1">Not an open-source invitation.</text>
<text x="47" y="211" fill="#C3CAD0" font-family="Arial,Helvetica,sans-serif" font-size="14" letter-spacing="2" font-weight="700">VIEWING ONLY   /   NO UNAUTHORIZED REUSE   /   ALL RIGHTS RESERVED</text>
<g transform="translate(994 107)" fill="none" stroke="#FFBC82" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
 <rect x="-43" y="12" width="86" height="72" rx="12" fill="#191D25" stroke="#FFB37C"/>
 <path d="M-27 12V-9a27 27 0 0 1 54 0v21"/>
 <circle cx="0" cy="43" r="6" fill="#FFB37C" stroke="none"/>
 <path d="M0 48v13"/>
</g>
<path class="lock" d="M905 48h175M905 213h175" stroke="#FF9D60" stroke-width="1" stroke-opacity=".36"/>
<text x="46" y="260" fill="#8D939C" font-family="Arial,Helvetica,sans-serif" font-size="10" letter-spacing="1.4">© 2026 REZWAN HOSSAIN PRINCE  ·  VISUAL ARCHIVE CLUB  ·  EASTERN UNIVERSITY</text>
</g>
</svg>
